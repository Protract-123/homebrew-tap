name: Update Alacritty Cask

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-cask.yml
    with:
      cask_name: alacritty
      github_repo: alacritty/alacritty
      tag_prefix: v
      asset_url_template: https://github.com/alacritty/alacritty/releases/download/v{VERSION}/Alacritty-v{VERSION}.dmg
