name: Update Cask

on:
  workflow_call:
    inputs:
      cask_name:
        required: true
        type: string
      github_repo:
        required: true
        type: string
      tag_prefix:
        required: false
        type: string
        default: ""
        description: "Prefix to strip from the release tag (e.g. 'v', 'release-')"
      asset_url_template:
        required: true
        type: string
        description: "Download URL with {VERSION} as placeholder"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check for new release
        id: check
        env:
          CASK_NAME: ${{ inputs.cask_name }}
          GITHUB_REPO: ${{ inputs.github_repo }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          CURRENT=$(sed -n 's/.*version "\([^"]*\)".*/\1/p' "Casks/${CASK_NAME}.rb")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          LATEST=$(curl -sf "https://api.github.com/repos/${GITHUB_REPO}/releases/latest" \
            | jq -r '.tag_name' | sed "s/^${TAG_PREFIX}//")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "No update needed ($CURRENT is latest)"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT -> $LATEST"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download asset and compute SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: sha_single
        env:
          VERSION: ${{ steps.check.outputs.latest }}
          ASSET_URL_TEMPLATE: ${{ inputs.asset_url_template }}
        run: |
          URL="${ASSET_URL_TEMPLATE//\{VERSION\}/$VERSION}"
          echo "Downloading $URL"
          curl -sfL -o asset "$URL"
          SHA256=$(sha256sum asset | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA256"

      - name: Update cask file
        if: steps.check.outputs.needs_update == 'true'
        env:
          CASK_NAME: ${{ inputs.cask_name }}
          NEW_VERSION: ${{ steps.check.outputs.latest }}
          NEW_SHA256: ${{ steps.sha_single.outputs.sha256 }}
        run: |
          CASK_FILE="Casks/${CASK_NAME}.rb"
          ARCH_BEFORE=$(grep -c '^[[:space:]]*arch ' "$CASK_FILE" || true)

          sed -i "s/^\([[:space:]]*\)version \"[^\"]*\"/\1version \"${NEW_VERSION}\"/" "$CASK_FILE"
          sed -i "s/^\([[:space:]]*\)sha256 \"[^\"]*\"/\1sha256 \"${NEW_SHA256}\"/" "$CASK_FILE"

          grep -q "version \"${NEW_VERSION}\"" "$CASK_FILE" || { echo "::error::version was not updated"; exit 1; }
          grep -q "sha256 \"${NEW_SHA256}\"" "$CASK_FILE" || { echo "::error::sha256 was not updated"; exit 1; }
          ARCH_AFTER=$(grep -c '^[[:space:]]*arch ' "$CASK_FILE" || true)
          [ "$ARCH_BEFORE" = "$ARCH_AFTER" ] || { echo "::error::arch stanza was modified"; exit 1; }

          echo "Updated cask:"
          cat "$CASK_FILE"

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        env:
          CASK_NAME: ${{ inputs.cask_name }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK_NAME}.rb"
          git commit -m "${CASK_NAME} - update ${CURRENT} -> ${LATEST}"
          # Several cask workflows share the same schedule, so main may have moved.
          git pull --rebase origin main
          git push
